<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan-Do-See 다이어리 (인증 보호됨)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (v10 모듈형) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyAjyu3AF4JJATmP1k2O0pSv6dj-XcUNB-E",
      authDomain: "pds-diary-a9b33.firebaseapp.com",
      projectId: "pds-diary-a9b33",
      storageBucket: "pds-diary-a9b33.firebasestorage.app",
      messagingSenderId: "677108739832",
      appId: "1:677108739832:web:b7660943dd8ac823f3d50d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 글로벌 객체로 노출하여 DOM 이벤트에서 접근 가능하게 설정
    window.appAuth = auth;
    window.appDb = db;
    window.fsDoc = doc;
    window.fsGetDoc = getDoc;
    window.fsSetDoc = setDoc;
    window.fsDeleteDoc = deleteDoc;
    window.fbSignIn = signInWithEmailAndPassword;
    window.fbSignUp = createUserWithEmailAndPassword;
    window.fbSignOut = signOut;
    window.fbDeleteUser = deleteUser;

    // 인증 상태 감시자 등록
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = user.email;
        window.currentUser = user;
        await loadUserData(user.uid);
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        window.currentUser = null;
      }
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ==================== [인증 영역: 로그인 / 회원가입] ==================== -->
  <div id="auth-section" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-black text-indigo-600 mb-1">Plan-Do-See 다이어리</h1>
        <p class="text-sm text-slate-500">안전하게 보호된 개인 학습 & 일정 관리 시스템</p>
      </div>

      <!-- 알림 메시지 상자 (오류 및 안내) -->
      <div id="auth-msg" class="hidden mb-4 p-3 rounded-lg text-xs leading-relaxed"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">이메일 계정</label>
          <input type="email" id="auth-email" placeholder="example@email.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호 (6자리 이상)</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex gap-2 pt-2">
          <button onclick="handleLogin()" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">로그인</button>
          <button onclick="handleSignUp()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-200 transition">회원가입</button>
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-400">심사 기준(T07-C03): 로그인 전에는 어떤 개인 데이터도 노출되지 않습니다.</p>
      </div>
    </div>
  </div>

  <!-- ==================== [메인 다이어리 애플리케이션 영역] ==================== -->
  <div id="app-section" class="hidden max-w-5xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- 최상단 헤더 네비게이션 -->
    <header class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h2 class="text-xl font-bold text-slate-800">Plan-Do-See 다이어리</h2>
          <span class="px-2 py-0.5 text-xs font-medium bg-emerald-50 text-emerald-600 rounded-full border border-emerald-200">🔒 보안 인증 적용됨</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">접속 계정: <span id="user-email-display" class="font-semibold text-slate-700"></span></p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="px-3 py-1.5 text-xs bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition font-medium">📥 내보내기 (.json)</button>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs bg-slate-600 text-white rounded-lg hover:bg-slate-700 transition font-medium">로그아웃</button>
        <button onclick="handleDeleteAccount()" class="px-3 py-1.5 text-xs bg-rose-50 text-rose-600 border border-rose-200 rounded-lg hover:bg-rose-100 transition font-medium">회원탈퇴</button>
      </div>
    </header>

    <!-- 1일차~5일차 지표 대시보드 (See) -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center">
        <p class="text-xs text-slate-400 font-medium">총 계획</p>
        <p id="stat-plans" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center">
        <p class="text-xs text-slate-400 font-medium">등록된 할 일</p>
        <p id="stat-tasks" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center">
        <p class="text-xs text-slate-400 font-medium">완료한 할 일</p>
        <p id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center">
        <p class="text-xs text-slate-400 font-medium">총 실행 시간</p>
        <p id="stat-hours" class="text-2xl font-bold text-amber-600 mt-1">0h</p>
      </div>
    </section>

    <!-- 계획 등록 및 목록 (Plan) -->
    <div class="grid md:grid-cols-3 gap-6">
      
      <!-- 좌측: 입력 폼 -->
      <div class="md:col-span-1 space-y-4">
        <!-- 계획 추가 카드 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <h3 class="text-sm font-bold text-slate-800 mb-3">🎯 새 목표 계획 추가 (Plan)</h3>
          <div class="space-y-3">
            <input type="text" id="plan-title" placeholder="목표 (예: 네트워크관리사 2급)" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-1 focus:ring-indigo-500">
            <input type="text" id="plan-criteria" placeholder="성공 기준 (예: 기출 3회독 70점)" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-1 focus:ring-indigo-500">
            <div class="grid grid-cols-2 gap-2">
              <input type="date" id="plan-start" class="w-full px-2 py-2 text-xs border rounded-lg">
              <input type="date" id="plan-end" class="w-full px-2 py-2 text-xs border rounded-lg">
            </div>
            <button onclick="addPlan()" class="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold hover:bg-indigo-700 transition">계획 등록</button>
          </div>
        </div>

        <!-- 세부 할 일 추가 카드 -->
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <h3 class="text-sm font-bold text-slate-800 mb-3">📝 세부 할 일 등록 (Do)</h3>
          <div class="space-y-3">
            <select id="task-plan-select" class="w-full px-3 py-2 text-xs border rounded-lg"></select>
            <input type="text" id="task-title" placeholder="할 일 (예: 서브넷 마스크 계산 정리)" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-1 focus:ring-indigo-500">
            <input type="number" id="task-est" step="0.5" placeholder="예상 소요 시간 (h)" class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-1 focus:ring-indigo-500">
            <button onclick="addTask()" class="w-full py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700 transition">할 일 추가</button>
          </div>
        </div>
      </div>

      <!-- 우측: 계획 및 할 일 목록 -->
      <div class="md:col-span-2 space-y-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <h3 class="text-sm font-bold text-slate-800 mb-3">📋 나의 계획 & 실행 진행 상황</h3>
          <div id="plans-container" class="space-y-4">
            <p class="text-xs text-slate-400 text-center py-6">등록된 계획이 없습니다. 왼쪽에서 새 계획을 추가해 보세요.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 애플리케이션 프론트엔드 비즈니스 로직 -->
  <script>
    let appData = { plans: [], tasks: [], executions: [] };

    function showAuthMsg(msg, isError = true) {
      const box = document.getElementById('auth-msg');
      box.className = isError 
        ? 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-rose-50 text-rose-600 border border-rose-200'
        : 'mb-4 p-3 rounded-lg text-xs leading-relaxed bg-emerald-50 text-emerald-600 border border-emerald-200';
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    // T07-C98, T07-C99 충족: 로그인 처리 및 오류 문구 통일
    async function handleLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) {
        showAuthMsg('이메일과 비밀번호를 모두 입력해 주세요.');
        return;
      }
      try {
        await window.fbSignIn(window.appAuth, email, pass);
      } catch (err) {
        // 보안 요구사항: 아이디 없음과 비번 불일치 시 동일한 메시지 출력
        showAuthMsg('이메일 또는 비밀번호가 올바르지 않습니다.');
      }
    }

    // T07-C94, T07-C98 충족: 회원가입 처리
    async function handleSignUp() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) {
        showAuthMsg('이메일과 비밀번호를 모두 입력해 주세요.');
        return;
      }
      if (pass.length < 6) {
        showAuthMsg('비밀번호는 최소 6자리 이상이어야 합니다.');
        return;
      }
      try {
        await window.fbSignUp(window.appAuth, email, pass);
        showAuthMsg('회원가입이 완료되었습니다!', false);
      } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
          showAuthMsg('이미 가입되어 있는 이메일 주소입니다.');
        } else {
          showAuthMsg('회원가입 처리 중 오류가 발생했습니다.');
        }
      }
    }

    // T07-C96 충족: 로그아웃
    async function handleLogout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        await window.fbSignOut(window.appAuth);
      }
    }

    // T07-C134 충족: 회원탈퇴 시 데이터 삭제 및 안내
    async function handleDeleteAccount() {
      const confirmDelete = confirm('정말로 계정을 삭제하시겠습니까?\n주의: 계정을 삭제하면 작성하신 모든 다이어리 데이터가 즉시 영구 삭제됩니다.');
      if (!confirmDelete) return;

      try {
        const user = window.currentUser;
        if (user) {
          // 1. 유저 전용 DB 문서 삭제
          await window.fsDeleteDoc(window.fsDoc(window.appDb, 'users', user.uid));
          // 2. 인증 계정 탈퇴
          await window.fbDeleteUser(user);
          alert('계정과 모든 데이터가 성공적으로 삭제되었습니다.');
        }
      } catch (err) {
        alert('계정 삭제 중 오류가 발생했습니다. 보안을 위해 다시 로그인한 직후 재시도해 주세요.');
      }
    }

    // 데이터 로드 (내 UID 문서만 조회)
    async function loadUserData(uid) {
      try {
        const userDocRef = window.fsDoc(window.appDb, 'users', uid);
        const snap = await window.fsGetDoc(userDocRef);
        if (snap.exists()) {
          appData = snap.data();
        } else {
          appData = { plans: [], tasks: [], executions: [] };
        }
        renderApp();
      } catch (err) {
        console.error('데이터 조회 거절 또는 오류:', err);
      }
    }

    // 데이터 저장 (내 UID 문서에만 저장)
    async function saveUserData() {
      if (!window.currentUser) return;
      try {
        const userDocRef = window.fsDoc(window.appDb, 'users', window.currentUser.uid);
        await window.fsSetDoc(userDocRef, appData);
        renderApp();
      } catch (err) {
        console.error('권한 거절 또는 저장 오류:', err);
        alert('저장 권한이 없거나 거절되었습니다.');
      }
    }

    function addPlan() {
      const title = document.getElementById('plan-title').value.trim();
      const criteria = document.getElementById('plan-criteria').value.trim();
      const start = document.getElementById('plan-start').value;
      const end = document.getElementById('plan-end').value;
      if (!title) { alert('목표 계획을 입력해 주세요.'); return; }

      const newPlan = {
        id: 'plan_' + Date.now(),
        title,
        criteria,
        start,
        end,
        createdAt: new Date().toISOString()
      };
      appData.plans.push(newPlan);
      document.getElementById('plan-title').value = '';
      document.getElementById('plan-criteria').value = '';
      saveUserData();
    }

    function addTask() {
      const planId = document.getElementById('task-plan-select').value;
      const title = document.getElementById('task-title').value.trim();
      const est = parseFloat(document.getElementById('task-est').value) || 1.0;
      if (!planId) { alert('할 일을 추가할 계획을 먼저 선택해 주세요.'); return; }
      if (!title) { alert('할 일 내용을 입력해 주세요.'); return; }

      const newTask = {
        id: 'task_' + Date.now(),
        planId,
        title,
        estimatedHours: est,
        actualHours: 0,
        completed: false,
        createdAt: new Date().toISOString()
      };
      appData.tasks.push(newTask);
      document.getElementById('task-title').value = '';
      document.getElementById('task-est').value = '';
      saveUserData();
    }

    function toggleTaskComplete(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveUserData();
      }
    }

    function addExecution(taskId) {
      const actual = prompt('실제 소요된 시간(h)을 입력하세요:', '1.5');
      if (actual === null) return;
      const hours = parseFloat(actual);
      if (isNaN(hours) || hours <= 0) { alert('유효한 시간을 입력하세요.'); return; }

      const obstacle = prompt('진행 중 막힌 원인이나 배운 점이 있다면 적어주세요 (없으면 빈칸):', '');
      
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.actualHours = (task.actualHours || 0) + hours;
        task.completed = true;
      }

      appData.executions.push({
        id: 'exec_' + Date.now(),
        taskId,
        actualHours: hours,
        obstacle: obstacle || '없음',
        timestamp: new Date().toISOString()
      });

      saveUserData();
    }

    // T07-C133 충족: 내보내기 기능
    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pds-diary-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderApp() {
      // 대시보드 지표 집계
      const totalPlans = appData.plans.length;
      const totalTasks = appData.tasks.length;
      const completedTasks = appData.tasks.filter(t => t.completed).length;
      const totalHours = (appData.executions || []).reduce((acc, cur) => acc + (cur.actualHours || 0), 0);

      document.getElementById('stat-plans').innerText = totalPlans;
      document.getElementById('stat-tasks').innerText = totalTasks;
      document.getElementById('stat-completed').innerText = completedTasks;
      document.getElementById('stat-hours').innerText = totalHours.toFixed(1) + 'h';

      // 계획 선택 셀렉트 박스 갱신
      const select = document.getElementById('task-plan-select');
      select.innerHTML = '<option value="">소속 계획을 선택하세요</option>' + 
        appData.plans.map(p => `<option value="${p.id}">${p.title}</option>`).join('');

      // 목록 렌더링
      const container = document.getElementById('plans-container');
      if (appData.plans.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">등록된 계획이 없습니다. 왼쪽에서 새 계획을 추가해 보세요.</p>';
        return;
      }

      container.innerHTML = appData.plans.map(plan => {
        const planTasks = appData.tasks.filter(t => t.planId === plan.id);
        return `
          <div class="border border-slate-100 bg-slate-50/50 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="text-sm font-bold text-slate-800">${plan.title}</h4>
                <p class="text-xs text-slate-500 mt-0.5">기준: ${plan.criteria || '미정'} | 기간: ${plan.start || '-'} ~ ${plan.end || '-'}</p>
              </div>
            </div>

            <!-- 소속 할 일 목록 -->
            <div class="space-y-1.5 pt-2 border-t border-slate-200/60">
              ${planTasks.length === 0 ? '<p class="text-xs text-slate-400">등록된 세부 할 일이 없습니다.</p>' : ''}
              ${planTasks.map(task => `
                <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200/70 text-xs">
                  <div class="flex items-center gap-2">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskComplete('${task.id}')" class="rounded text-indigo-600">
                    <span class="${task.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${task.title}</span>
                    <span class="text-[10px] text-slate-400">(예상: ${task.estimatedHours}h / 실측: ${task.actualHours || 0}h)</span>
                  </div>
                  <div class="flex gap-1">
                    <button onclick="addExecution('\${task.id}')" class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded text-[11px] hover:bg-indigo-100 font-medium">+ 실행 기록</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
